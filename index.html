<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STΔN studio." />
    <meta name="application-name" content="STΔN studio." />
    <meta
      name="description"
      content="STΔN studio. — Custom 3D printed shadow lamps, precision additive fabrication. Configure yours in the live 3D studio."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font load: never delay the first paint / boot splash -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>STΔN studio. — Shadow Lamp Studio</title>
    <!-- Critical shell paint: carbon void + instant boot splash before any CSS/JS arrives — no empty black screen on first load -->
    <style>
      html {
        background: #070708;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #070708;
        background-color: #070708;
      }
      /* Instant boot splash — createRoot() clears #root on mount, so React replaces this */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #070708;
      }
      .boot-mark {
        font-family: 'Plus Jakarta Sans', -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        display: flex;
        align-items: baseline;
        gap: 0.42em;
      }
      .boot-mark .boot-sub {
        font-size: 0.74em;
        font-weight: 700;
      }
      .boot-mark .boot-period {
        color: #ff2d55;
      }
      .boot-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.35);
      }
      .boot-dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #ff2d55;
        box-shadow: 0 0 8px rgba(255, 45, 85, 0.9);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-label="STΔN studio">
        <div class="boot-mark">
          <span>STΔN</span>
          <span class="boot-sub">studio<span class="boot-period">.</span></span>
        </div>
        <div class="boot-tag"><span class="boot-dot"></span>Toolchain booting</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
