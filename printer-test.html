<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bambu Lab A1 Mini - Kinematics & Animation Test</title>
    <style>
        body { margin: 0; padding: 0; background: #0c0e14; color: #fff; font-family: monospace; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #status { position: fixed; top: 16px; left: 16px; z-index: 10; background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 8px; border: 1px solid #333; }
        #controls { position: fixed; bottom: 16px; left: 16px; z-index: 10; background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 8px; border: 1px solid #333; display: flex; gap: 12px; }
        button { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div id="status">Loading Bambu Lab A1 Mini...</div>
    <div id="controls">
        <button id="toggle-anim">Pause Animation</button>
        <button id="reset-cam">Reset Camera</button>
    </div>
    <canvas id="canvas"></canvas>

    <script src="three.min.js"></script>
    <script src="lib/GLTFLoader.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111318);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 80);

        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(30, 60, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x90b0ff, 1.2);
        fillLight.position.set(-40, 20, -30);
        scene.add(fillLight);

        // Floor shadow plane
        const FLOOR_Y = -2.58;
        const grid = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
        grid.position.y = FLOOR_Y;
        scene.add(grid);

        // Printer Group positioned in studio space
        const printerGroup = new THREE.Group();
        printerGroup.position.set(2.4, FLOOR_Y, -0.3);
        printerGroup.rotation.y = -Math.PI * 0.18; // Cinematic 3/4 beauty angle
        const PRINTER_SCALE = 5.2;
        printerGroup.scale.set(PRINTER_SCALE, PRINTER_SCALE, PRINTER_SCALE);
        scene.add(printerGroup);

        // Spool Mockup on the left
        const spoolGroup = new THREE.Group();
        spoolGroup.position.set(-3.2, 0.4, 0.0);
        spoolGroup.rotation.y = 0.35;
        scene.add(spoolGroup);

        const spoolCylGeo = new THREE.CylinderGeometry(1.95, 1.95, 1.2, 48);
        const spoolMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.4 });
        const spoolCyl = new THREE.Mesh(spoolCylGeo, spoolMat);
        spoolCyl.rotation.z = Math.PI / 2;
        spoolGroup.add(spoolCyl);

        // Coiled filament core on spool
        const coilGeo = new THREE.CylinderGeometry(1.82, 1.82, 1.18, 48);
        const coilMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.28 });
        const coilMesh = new THREE.Mesh(coilGeo, coilMat);
        coilMesh.rotation.z = Math.PI / 2;
        spoolGroup.add(coilMesh);

        // Dynamic Filament Tube
        const strandMat = new THREE.MeshStandardMaterial({
            color: 0xef4444,
            roughness: 0.25,
            metalness: 0.05
        });
        
        let strandPoints = [
            new THREE.Vector3(-2.2, 1.8, 0.2),  // Peel point on spool
            new THREE.Vector3(-1.0, 2.2, 0.6),  // Upward loop
            new THREE.Vector3( 0.4, 1.9, 0.8),  // Mid-air glide
            new THREE.Vector3( 1.4, 1.4, 0.4),  // Arc towards printer
            new THREE.Vector3( 2.0, 0.8, 0.1),  // Approach to toolhead
            new THREE.Vector3( 2.2, 0.5, 0.0)   // Enters inlet!
        ];
        let strandCurve = new THREE.CatmullRomCurve3(strandPoints, false, 'centripetal', 0.5);
        let strandGeo = new THREE.TubeGeometry(strandCurve, 120, 0.024, 12, false);
        const strandMesh = new THREE.Mesh(strandGeo, strandMat);
        scene.add(strandMesh);

        let toolhead = null;
        let xGantry = null;
        let bed = null;
        let inletObj = null;
        let isAnimating = true;

        const loader = new THREE.GLTFLoader();
        loader.load(
            'bambu_a1_mini_standard.glb',
            (gltf) => {
                const model = gltf.scene;
                printerGroup.add(model);
                statusEl.innerHTML = 'Model Loaded! Initializing kinematics...';
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                toolhead = model.getObjectByName('Toolhead');
                xGantry = model.getObjectByName('Motor');
                bed = model.getObjectByName('Heatbed_2');
                inletObj = model.getObjectByName('Input');

                statusEl.innerHTML = `Loaded: Toolhead=${!!toolhead}, Gantry=${!!xGantry}, Bed=${!!bed}, Inlet=${!!inletObj}`;

                // Set initial positions
                if (toolhead) toolhead.userData.initialPos = toolhead.position.clone();
                if (xGantry) xGantry.userData.initialPos = xGantry.position.clone();
                if (bed) bed.userData.initialPos = bed.position.clone();

                // Frame camera comfortably
                camera.position.set(0, 1.2, 8.5);
                camera.lookAt(0, 0, 0);
            },
            (progress) => {
                const pct = Math.round((progress.loaded / progress.total) * 100);
                statusEl.textContent = `Loading: ${pct}%`;
            },
            (error) => {
                statusEl.innerHTML = `<span style="color:#ef4444">Error: ${error.message}</span>`;
            }
        );

        // Simple mouse orbit
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        window.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = (e.clientX - prevMouse.x) * 0.008;
            const dy = (e.clientY - prevMouse.y) * 0.008;
            camera.position.x += dx * 20;
            camera.position.y += dy * 20;
            camera.lookAt(0, 0, 0);
            prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        document.getElementById('toggle-anim').addEventListener('click', () => {
            isAnimating = !isAnimating;
            document.getElementById('toggle-anim').textContent = isAnimating ? 'Pause Animation' : 'Resume Animation';
        });

        // Animation clock & kinematics
        const clock = new THREE.Clock();
        let currentLayer = 0;
        const totalLayers = 25;
        let layerZOffset = 0;
        let pathTime = 0;

        // Create a printed part on the bed (e.g. STΔN precision cube / emblem)
        const printedPartGroup = new THREE.Group();
        scene.add(printedPartGroup);

        // STΔN Printed Object Geometry
        const partGeo = new THREE.BoxGeometry(0.08, 0.05, 0.08);
        const partMat = new THREE.MeshStandardMaterial({
            color: 0xef4444, // Signature STΔN crimson filament!
            roughness: 0.35,
            metalness: 0.1,
            bumpScale: 0.002
        });
        const printedPartMesh = new THREE.Mesh(partGeo, partMat);
        printedPartMesh.castShadow = true;
        printedPartMesh.receiveShadow = true;
        printedPartGroup.add(printedPartMesh);

        // Toolpath generation (smooth perimeters + rapid infill)
        // Returns { xOffset, yOffset } relative to bed center
        function getToolpathPosition(t) {
            const cycle = t % 8.0; // 8-second repeating print cycle per layer

            // 0s - 3s: Outer perimeter rectangle
            if (cycle < 3.0) {
                const p = cycle / 3.0; // 0 to 1
                const side = Math.floor(p * 4);
                const subP = (p * 4) % 1;
                const halfS = 0.035; // 35mm half width
                if (side === 0) return { x: THREE.MathUtils.lerp(-halfS, halfS, subP), y: -halfS, isInfill: false };
                if (side === 1) return { x: halfS, y: THREE.MathUtils.lerp(-halfS, halfS, subP), isInfill: false };
                if (side === 2) return { x: THREE.MathUtils.lerp(halfS, -halfS, subP), y: halfS, isInfill: false };
                return { x: -halfS, y: THREE.MathUtils.lerp(halfS, -halfS, subP), isInfill: false };
            }
            // 3s - 7.5s: High-speed 45-degree rectilinear infill
            else if (cycle < 7.5) {
                const infillP = (cycle - 3.0) / 4.5;
                const lines = 14;
                const currentLine = Math.floor(infillP * lines);
                const lineFrac = (infillP * lines) % 1;
                const yPos = THREE.MathUtils.lerp(-0.03, 0.03, currentLine / lines);
                const isEven = currentLine % 2 === 0;
                const xStart = isEven ? -0.03 : 0.03;
                const xEnd = isEven ? 0.03 : -0.03;
                return {
                    x: THREE.MathUtils.lerp(xStart, xEnd, lineFrac),
                    y: yPos + (lineFrac * 0.004),
                    isInfill: true
                };
            }
            // 7.5s - 8.0s: Rapid travel move & layer step
            else {
                return { x: 0, y: 0, isInfill: false, isTravel: true };
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (isAnimating && toolhead && bed && xGantry) {
                pathTime += delta * 1.6; // Print speed multiplier
                const path = getToolpathPosition(pathTime);

                const initT = toolhead.userData.initialPos;
                const initB = bed.userData.initialPos;
                const initG = xGantry.userData.initialPos;

                // Model scale conversion factor:
                // Model is in FBX units (~100x Three.js standard meters)
                // In FBX space:
                // Toolhead moves on Z: -5.606 is home, range is ~[-15, 15] (span ~30)
                // Bed moves on X: 0 is home, range is ~[-12, 12] (span ~24)
                // Z layer height: Y moves up ~0.04 per layer
                
                const fbxScale = 220; // Maps our 0.07m part to ~15 FBX units
                const targetHeadZ = initT.z + (path.x * fbxScale);
                const targetBedX = initB.x + (-path.y * fbxScale);

                // Snappy acceleration/jerk physics (faster on infill)
                const lerpFactor = path.isInfill ? 0.45 : 0.25;
                toolhead.position.z += (targetHeadZ - toolhead.position.z) * lerpFactor;
                bed.position.x += (targetBedX - bed.position.x) * lerpFactor;

                // Layer progression
                const layerIndex = Math.floor(pathTime / 8.0);
                const layerFrac = (pathTime % 8.0) / 8.0;
                layerZOffset = (layerIndex % totalLayers) * 0.25;

                toolhead.position.y = initT.y + layerZOffset;
                xGantry.position.y = initG.y + layerZOffset;

                // Sync printed part position to bed so it rides with the moving bed!
                const pei = scene.getObjectByName('PEI_Plate');
                if (pei) {
                    const peiWorld = new THREE.Vector3();
                    pei.getWorldPosition(peiWorld);
                    printedPartGroup.position.set(peiWorld.x, peiWorld.y + 0.025 + (layerZOffset * 0.01), peiWorld.z);
                }

                // Dynamic filament feeding into toolhead inlet
                if (inletObj) {
                    const inletWorld = new THREE.Vector3();
                    inletObj.getWorldPosition(inletWorld);
                    
                    strandPoints[5].copy(inletWorld);
                    strandPoints[4].set(inletWorld.x - 0.15, inletWorld.y + 0.55, inletWorld.z + 0.05);
                    strandPoints[3].set(inletWorld.x - 0.85, inletWorld.y + 1.25, inletWorld.z + 0.25);

                    strandGeo.dispose();
                    strandCurve = new THREE.CatmullRomCurve3(strandPoints, false, 'centripetal', 0.5);
                    strandGeo = new THREE.TubeGeometry(strandCurve, 120, 0.024, 12, false);
                    strandMesh.geometry = strandGeo;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
